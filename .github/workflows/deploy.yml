name: Deploy on GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  package:
    name: Build container package
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.package-version.outputs.image }}
      tag: ${{ steps.package-version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create package version
        id: package-version
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          BUILD_DATE="$(TZ=Asia/Kolkata date +%Y%m%d)"
          EXISTING_TAGS="$(
            gh api --paginate \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null || true
          )"
          LAST_SEQUENCE="$(
            printf '%s\n' "${EXISTING_TAGS}" \
              | sed -nE "s/^${BUILD_DATE}-([0-9]+)$/\1/p" \
              | sort -nr \
              | head -n 1
          )"
          NEXT_SEQUENCE=$((10#${LAST_SEQUENCE:-0} + 1))
          printf -v PACKAGE_TAG '%s-%02d' "${BUILD_DATE}" "${NEXT_SEQUENCE}"
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "image=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${PACKAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.package-version.outputs.image }}:${{ steps.package-version.outputs.tag }}

  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, package]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
